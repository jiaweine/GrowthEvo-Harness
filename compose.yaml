name: growthevo

services:
  postgres:
    image: postgres:17.11@sha256:e31e3d5327d1806f6177827c9710643e4f35f7ab3f14d26d05332753d3e95ee0
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${GROWTHEVO_POSTGRES_USER:-growthevo}
      POSTGRES_PASSWORD: ${GROWTHEVO_POSTGRES_PASSWORD:?set GROWTHEVO_POSTGRES_PASSWORD}
      POSTGRES_DB: ${GROWTHEVO_POSTGRES_DB:-growthevo}
    volumes:
      - growthevo-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    stop_grace_period: 30s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      GROWTHEVO_MODE: ${GROWTHEVO_MODE:-api}
      GROWTHEVO_ENV: ${GROWTHEVO_ENV:-self-hosted}
      GROWTHEVO_DATABASE_URL: ${GROWTHEVO_DATABASE_URL:?set GROWTHEVO_DATABASE_URL}
      GROWTHEVO_CORS_ORIGINS: ${GROWTHEVO_CORS_ORIGINS:-}
      GROWTHEVO_AUTH_ISSUER: ${GROWTHEVO_AUTH_ISSUER:-}
      GROWTHEVO_AUTH_JWKS_URL: ${GROWTHEVO_AUTH_JWKS_URL:-}
      GROWTHEVO_AUTH_AUDIENCE: ${GROWTHEVO_AUTH_AUDIENCE:-}
    ports:
      - "${GROWTHEVO_API_BIND:-127.0.0.1}:${GROWTHEVO_API_PORT:-8765}:8765"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/api/ready', timeout=3)",
        ]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 15s
    stop_grace_period: 30s

volumes:
  growthevo-postgres:
