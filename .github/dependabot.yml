version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(actions)"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(container-deps)"

  # Python research/evidence dependencies are intentionally not managed by
  # Dependabot. Changes to locked scientific/runtime pins must go through the
  # repository's evidence/provenance review so accepted benchmark identities
  # cannot drift through an automated dependency PR.
  - package-ecosystem: "npm"
    directory: "/apps/mobile"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(mobile-deps)"
    # Expo SDK 57 is intentionally kept on its official React/RN/toolchain
    # compatibility line. Patch updates inside these supported lines remain
    # eligible; crossing a boundary below requires an intentional Expo SDK
    # migration with native/runtime validation rather than an isolated bump.
    ignore:
      - dependency-name: "react"
        versions:
          - ">=19.3.0"
      - dependency-name: "@types/react"
        versions:
          - ">=19.3.0"
      - dependency-name: "react-native"
        versions:
          - ">=0.87.0"
      - dependency-name: "typescript"
        versions:
          - ">=7.0.0"
