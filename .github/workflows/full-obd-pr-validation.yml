name: Full OBD Research Validation

on:
  workflow_dispatch:
    inputs:
      experiment_reason:
        description: "New preregistered experiment or explicit evidence rerun reason"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: full-obd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  full-obd:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      EXPECTED_GIT_SHA: ${{ github.sha }}
      EXPERIMENT_REASON: ${{ inputs.experiment_reason }}
      ACCEPTED_ENVIRONMENT: benchmarks/ope/results/obd-full-all-random-to-bts/7d538cea/environment.txt

    steps:
      - name: Checkout exact evidence commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}

      - name: Set up Python and frozen OBD cache
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            benchmarks/ope/results/obd-full-all-random-to-bts/7d538cea/environment.txt

      - name: Inspect initial runner resources
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_GIT_SHA"
          test -n "$EXPERIMENT_REASON"
          test -f "$ACCEPTED_ENVIRONMENT"
          test "${RUNNER_OS:-}" = "Linux"
          grep -q '^VERSION_ID="24.04"$' /etc/os-release
          mkdir -p /tmp/growthevo-full-obd
          {
            printf 'runner_os=%s\n' "${RUNNER_OS:-unknown}"
            printf 'runner_arch=%s\n' "${RUNNER_ARCH:-unknown}"
            printf 'image_os=%s\n' "${ImageOS:-unknown}"
            printf 'image_version=%s\n' "${ImageVersion:-unknown}"
            printf 'python=%s\n' "$(python --version 2>&1)"
            printf 'uname=%s\n' "$(uname -a)"
            printf 'libc=%s\n' "$(ldd --version | head -n 1)"
            printf '%s\n' '--- /etc/os-release ---'
            cat /etc/os-release
          } > /tmp/growthevo-full-obd/runner-environment.txt
          printf 'experiment_reason=%s\n' "$EXPERIMENT_REASON"
          cat /tmp/growthevo-full-obd/runner-environment.txt
          df -h
          free -h

      - name: Install frozen CPU research environment
        run: |
          mkdir -p /tmp/growthevo-full-obd
          grep -E '^[[:alnum:]_.-]+==' "$ACCEPTED_ENVIRONMENT" \
            > /tmp/growthevo-full-obd/accepted-constraints.txt
          test -s /tmp/growthevo-full-obd/accepted-constraints.txt

          python -m pip install --upgrade pip
          python -m pip install \
            --index-url https://download.pytorch.org/whl/cpu \
            --extra-index-url https://pypi.org/simple \
            --constraint /tmp/growthevo-full-obd/accepted-constraints.txt \
            'torch==2.13.0+cpu'
          python -m pip install \
            --no-deps \
            --constraint /tmp/growthevo-full-obd/accepted-constraints.txt \
            'obp==0.4.1'
          python -m pip install \
            --constraint /tmp/growthevo-full-obd/accepted-constraints.txt \
            -e '.[obd]'
          python scripts/verify_frozen_environment.py "$ACCEPTED_ENVIRONMENT"
          python -m pip freeze > /tmp/growthevo-full-obd/pip-freeze.txt
          df -h

      - name: Run full preregistered Open Bandit benchmark
        shell: bash
        run: |
          set -o pipefail
          mkdir -p /tmp/growthevo-full-obd
          python scripts/run_obd_full_locked.py \
            --cache-dir /tmp/growthevo-full-obd/cache \
            --output-dir /tmp/growthevo-full-obd/result \
            --prediction-batch-size 25000 \
            2>&1 | tee /tmp/growthevo-full-obd/full-run.log

      - name: Inspect final runner resources and result
        if: always()
        run: |
          df -h
          free -h
          du -sh /tmp/growthevo-full-obd/* 2>/dev/null || true
          if test -f /tmp/growthevo-full-obd/result/locked-result.json; then
            python - <<'PY'
          import json
          import os
          from pathlib import Path
          root = Path('/tmp/growthevo-full-obd/result')
          result = json.loads((root / 'locked-result.json').read_text())
          manifest = json.loads((root / 'export' / 'export_manifest.json').read_text())
          provenance = json.loads((root / 'source-provenance.json').read_text())
          artifact = result['artifact']
          expected_sha = os.environ['EXPECTED_GIT_SHA']
          assert artifact['commit_sha'] == expected_sha
          assert provenance['growth_evo_commit_sha'] == expected_sha
          assert artifact['tuning_fingerprint'] != artifact['test_fingerprint']
          assert artifact['metrics']['support_coverage'] >= 0.95
          assert artifact['metrics']['effective_sample_ratio'] >= 0.05
          assert artifact['metrics']['validation_support_coverage'] >= 0.95
          assert artifact['metrics']['validation_effective_sample_ratio'] >= 0.05
          print(json.dumps({
              'manifest': manifest,
              'source_provenance': provenance,
              'selected_candidate': artifact['selected_candidate'],
              'metrics': artifact['metrics'],
              'protocol_fingerprint': artifact['protocol_fingerprint'],
              'tuning_fingerprint': artifact['tuning_fingerprint'],
              'test_fingerprint': artifact['test_fingerprint'],
              'experiment_plan': result['experiment_plan'],
          }, indent=2, sort_keys=True))
          PY
          fi

      - name: Upload full OBD research evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: obd-full-preregistered-evidence
          if-no-files-found: warn
          retention-days: 30
          path: |
            /tmp/growthevo-full-obd/accepted-constraints.txt
            /tmp/growthevo-full-obd/runner-environment.txt
            /tmp/growthevo-full-obd/pip-freeze.txt
            /tmp/growthevo-full-obd/full-run.log
            /tmp/growthevo-full-obd/result/source-provenance.json
            /tmp/growthevo-full-obd/result/obd-full-all-random-to-bts.v1.json
            /tmp/growthevo-full-obd/result/export/export_manifest.json
            /tmp/growthevo-full-obd/result/export/ope_candidates.json
            /tmp/growthevo-full-obd/result/locked-result.json
