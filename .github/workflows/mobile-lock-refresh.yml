name: Temporary Mobile Lock Refresh
on:
  push:
    branches:
      - feat/persistent-growth-operations
    paths:
      - .github/workflows/mobile-lock-refresh.yml

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22.13"
      - name: Generate correct npm lockfile with official npm resolution
        working-directory: apps/mobile
        run: |
          npm install expo@~57.0.32 --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --no-audit --no-fund
          ./node_modules/.bin/expo install --check
          npm run typecheck
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: refreshed-mobile-npm-lock
          path: apps/mobile/package-lock.json
          if-no-files-found: error
