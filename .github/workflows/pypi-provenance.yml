name: PyPI PEP 740 Provenance

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  real-pypi-provenance:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pinned PEP 740 verification stack
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev,attestation-pypi]'
          python - <<'PY'
          import pypi_attestations
          import sigstore

          from growthevo.evolution.pypi_provenance import PYPI_ATTESTATIONS_VERSION
          from growthevo.evolution.sigstore_attestation import SIGSTORE_SDK_VERSION

          assert pypi_attestations.__version__ == PYPI_ATTESTATIONS_VERSION
          assert sigstore.__version__ == SIGSTORE_SDK_VERSION
          PY

      - name: Verify pinned public PyPI provenance end to end
        run: python -m pytest tests/test_pypi_provenance_real_fixture.py -q
