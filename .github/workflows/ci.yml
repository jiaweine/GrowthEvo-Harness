name: GrowthEvo CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Test
        run: pytest --cov=growthevo --cov-report=term-missing

      - name: Runtime demo smoke test
        run: python examples/demo.py

      - name: Training demo smoke test
        run: python examples/training_demo.py

  package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
          cache: pip

      - name: Build wheel and sdist
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
          python -m build
          python -m twine check dist/*

      - name: Install wheel in clean environment
        run: |
          python -m venv /tmp/growthevo-wheel
          /tmp/growthevo-wheel/bin/python -m pip install --upgrade pip
          /tmp/growthevo-wheel/bin/python -m pip install "$GITHUB_WORKSPACE"/dist/*.whl
          cd /tmp
          /tmp/growthevo-wheel/bin/python -c "import growthevo; print(growthevo.__file__)"
          /tmp/growthevo-wheel/bin/growthevo-locked-ope --help
          /tmp/growthevo-wheel/bin/growthevo-locked-targeting --help

  obd-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SB_OBP_COMMIT: 1c6d14677ec6f06094a2f8886a1158bab99c571e
      OBD_DATASET_SOURCE: github:sb-ai-lab/sb-obp@1c6d14677ec6f06094a2f8886a1158bab99c571e:obd-small
      OBD_PLAN: benchmarks/ope/obd-small-all-random-to-bts.v1.json

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install GrowthEvo with CPU-only OBD bridge
        run: |
          python -m pip install --upgrade pip
          pip install \
            --index-url https://download.pytorch.org/whl/cpu \
            --extra-index-url https://pypi.org/simple \
            'torch==2.13.0+cpu'
          pip install -e '.[obd]'
          python - <<'PY'
          import torch

          assert torch.__version__ == "2.13.0+cpu"
          assert not torch.cuda.is_available()
          print("torch", torch.__version__, "cuda_available=", torch.cuda.is_available())
          PY

      - name: Verify compact logistic Q matches OBP tensor predictions
        run: |
          python - <<'PY'
          import importlib.util
          from pathlib import Path

          import numpy as np
          from obp.ope import RegressionModel
          from sklearn.linear_model import LogisticRegression

          script = Path("scripts/export_obd_locked_ope.py")
          spec = importlib.util.spec_from_file_location("obd_exporter", script)
          module = importlib.util.module_from_spec(spec)
          assert spec is not None and spec.loader is not None
          spec.loader.exec_module(module)

          n = 600
          index = np.arange(n)
          context = np.column_stack(
              [
                  np.sin(index / 17.0),
                  np.cos(index / 29.0),
                  (index % 5) / 5.0,
              ]
          )
          action = index % 3
          position = index % 2
          reward = ((index % 7 == 0) | (index % 11 == 0)).astype(float)
          action_context = np.eye(3)
          shared_action_dist = np.asarray(
              [
                  [0.50, 0.20],
                  [0.30, 0.30],
                  [0.20, 0.50],
              ]
          )
          seed = 12345
          folds = 3
          feedback = {
              "n_rounds": n,
              "n_actions": 3,
              "action": action,
              "position": position,
              "reward": reward,
              "pscore": np.full(n, 1.0 / 3.0),
              "context": context,
              "action_context": action_context,
          }

          reference_model = RegressionModel(
              n_actions=3,
              len_list=2,
              action_context=action_context,
              base_model=LogisticRegression(
                  C=1.0,
                  max_iter=1000,
                  random_state=seed,
              ),
          )
          full_q = reference_model.fit_predict(
              context=context,
              action=action,
              reward=reward,
              position=position,
              n_folds=folds,
              random_state=seed,
          )
          expected_baseline = full_q[index, action, position]
          expected_target = np.empty(n)
          for row in range(n):
              expected_target[row] = np.dot(
                  full_q[row, :, position[row]],
                  shared_action_dist[:, position[row]],
              )

          compact_baseline, compact_target = module._fit_q_terms(
              feedback,
              shared_action_dist,
              n_actions=3,
              len_list=2,
              action_context=action_context,
              n_folds=folds,
              random_state=seed,
              q_model="logistic",
              prediction_batch_size=37,
          )
          np.testing.assert_allclose(compact_baseline, expected_baseline, rtol=1e-12, atol=1e-12)
          np.testing.assert_allclose(compact_target, expected_target, rtol=1e-12, atol=1e-12)
          PY

      - name: Fetch pinned public small Open Bandit Dataset
        run: |
          git init /tmp/sb-obp
          git -C /tmp/sb-obp remote add origin https://github.com/sb-ai-lab/sb-obp.git
          git -C /tmp/sb-obp fetch --depth 1 origin "$SB_OBP_COMMIT"
          git -C /tmp/sb-obp checkout --detach FETCH_HEAD
          test "$(git -C /tmp/sb-obp rev-parse HEAD)" = "$SB_OBP_COMMIT"

      - name: Export preregistered OBD evidence with compact cross-fitted Q
        run: |
          python scripts/export_obd_locked_ope.py \
            --campaign all \
            --data-path /tmp/sb-obp/obd \
            --dataset-source "$OBD_DATASET_SOURCE" \
            --output-dir /tmp/growthevo-obd \
            --validation-fraction 0.5 \
            --n-sim 500 \
            --q-model logistic \
            --q-folds 2 \
            --random-state 12345

      - name: Run preregistered evidence-gated locked OPE selection
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess

          root = "/tmp/growthevo-obd"
          with open(f"{root}/export_manifest.json", encoding="utf-8") as handle:
              manifest = json.load(handle)
          assert manifest["schema_version"] == "growthevo.obd-export.v3"
          assert manifest["q_model"] == "logistic"
          assert manifest["q_folds"] == 2
          assert manifest["dataset_source"] == os.environ["OBD_DATASET_SOURCE"]
          assert manifest["action_distribution_storage"] == "shared_context_free"
          assert manifest["q_prediction_storage"] == "compact_factual_and_target"
          assert manifest["target_reference_loader"] == "chunked_reward_only"

          subprocess.run(
              [
                  "growthevo-locked-ope",
                  "--tuning-jsonl", f"{root}/validation.jsonl",
                  "--test-jsonl", f"{root}/holdout.jsonl",
                  "--candidates-json", f"{root}/ope_candidates.json",
                  "--tuning-reference", str(manifest["validation_reference"]),
                  "--test-reference", str(manifest["holdout_reference"]),
                  "--benchmark", "open-bandit-ope-small-evidence",
                  "--dataset", "obd-small-all-random-to-bts",
                  "--commit-sha", "${{ github.event.pull_request.head.sha }}",
                  "--support-propensity-floor", "0.001",
                  "--min-support-coverage", "0.95",
                  "--min-effective-sample-ratio", "0.05",
                  "--experiment-plan-json", os.environ["OBD_PLAN"],
                  "--export-manifest-json", f"{root}/export_manifest.json",
                  "--output", f"{root}/locked-result.json",
              ],
              check=True,
          )

          with open(f"{root}/locked-result.json", encoding="utf-8") as handle:
              result = json.load(handle)
          artifact = result["artifact"]
          prereg = result["experiment_plan"]
          assert result["schema_version"] == "growthevo.locked-ope-run.v3"
          assert prereg is not None
          assert result["evidence_gate"]["min_support_coverage"] == 0.95
          assert result["evidence_gate"]["min_effective_sample_ratio"] == 0.05
          assert result["evidence_gate"]["require_positive_importance_mass"] is True
          assert artifact["selected_candidate"]
          assert artifact["metrics"]["candidate_count"] >= 5
          assert artifact["metrics"]["support_coverage"] >= 0.95
          assert artifact["metrics"]["effective_sample_ratio"] >= 0.05
          assert artifact["metrics"]["validation_support_coverage"] >= 0.95
          assert artifact["metrics"]["validation_effective_sample_ratio"] >= 0.05
          assert artifact["metrics"]["experiment_plan_fingerprint"] == prereg["fingerprint"]
          assert artifact["metrics"]["dataset_source"] == os.environ["OBD_DATASET_SOURCE"]
          assert artifact["tuning_fingerprint"] != artifact["test_fingerprint"]
          print(json.dumps({
              "manifest": manifest,
              "evidence_gate": result["evidence_gate"],
              "experiment_plan": prereg,
              "validation_scores": result["validation_scores"],
              "artifact": artifact,
          }, indent=2, sort_keys=True))
          PY

      - name: Upload locked OBD evidence summary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: obd-small-locked-evidence
          if-no-files-found: error
          retention-days: 14
          path: |
            benchmarks/ope/obd-small-all-random-to-bts.v1.json
            /tmp/growthevo-obd/export_manifest.json
            /tmp/growthevo-obd/ope_candidates.json
            /tmp/growthevo-obd/locked-result.json
