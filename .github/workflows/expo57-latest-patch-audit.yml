name: Expo SDK 57 latest-patch audit

on:
  push:
    branches:
      - audit/expo57-latest-patch

permissions:
  contents: read

jobs:
  audit:
    if: github.repository == 'jiaweine/GrowthEvo-Harness' && github.ref == 'refs/heads/audit/expo57-latest-patch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.13'
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Install current lock
        run: npm ci --no-audit --no-fund

      - name: Experimentally move Expo within SDK 57
        run: npm install expo@~57.0.26 --save --no-audit --no-fund

      - name: Show experimental direct dependency set
        run: |
          node -e "const p=require('./package.json'); console.log(JSON.stringify({expo:p.dependencies.expo,react:p.dependencies.react,reactNative:p.dependencies['react-native']},null,2))"
          npm ls expo react react-native --depth=0

      - name: Validate Expo compatibility and TypeScript
        run: |
          ./node_modules/.bin/expo install --check
          npm run typecheck

      - name: Compare npm audit after latest SDK 57 patch
        shell: bash
        run: |
          npm audit --omit=dev --json > /tmp/runtime-audit.json || true
          npm audit --json > /tmp/full-audit.json || true
          node - <<'NODE'
          const fs = require('fs');
          for (const [label, file] of [['runtime','/tmp/runtime-audit.json'],['full','/tmp/full-audit.json']]) {
            const data = JSON.parse(fs.readFileSync(file,'utf8'));
            console.log(`=== ${label} ===`);
            console.log(JSON.stringify({
              metadata: data.metadata?.vulnerabilities || {},
              packages: Object.entries(data.vulnerabilities || {})
                .map(([name,v]) => ({name,severity:v.severity,direct:Boolean(v.isDirect),fixAvailable:v.fixAvailable}))
                .sort((a,b)=>a.name.localeCompare(b.name))
            }, null, 2));
          }
          NODE
