name: Mobile Expo compatibility gate bootstrap

on:
  push:
    branches:
      - ci/mobile-expo-compatibility-gate

permissions:
  contents: write

jobs:
  patch-product-surface:
    if: github.repository == 'jiaweine/GrowthEvo-Harness' && github.ref == 'refs/heads/ci/mobile-expo-compatibility-gate'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ci/mobile-expo-compatibility-gate

      - name: Insert Expo compatibility gate exactly once
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/product-surface.yml')
          text = path.read_text(encoding='utf-8')
          needle = '      - name: Typecheck\n        run: npm run typecheck\n'
          replacement = (
              '      - name: Validate Expo SDK dependency compatibility\n'
              '        run: ./node_modules/.bin/expo install --check\n'
              '      - name: Typecheck\n'
              '        run: npm run typecheck\n'
          )
          if text.count(needle) != 1:
              raise SystemExit(f'expected one mobile typecheck insertion point, got {text.count(needle)}')
          if 'Validate Expo SDK dependency compatibility' in text:
              raise SystemExit('Expo compatibility step already exists')
          path.write_text(text.replace(needle, replacement), encoding='utf-8')
          PY

      - name: Run the new product contract test
        run: |
          python -m pip install pytest
          python -m pytest -q tests/test_product_mobile_dependency_contract.py

      - name: Remove bootstrap and commit the validated gate
        run: |
          git rm .github/workflows/mobile-expo-gate-bootstrap.yml
          git add .github/workflows/product-surface.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'ci(mobile): validate Expo dependency compatibility'
          git push origin HEAD:ci/mobile-expo-compatibility-gate
