name: Product Surface CI

on:
  pull_request:
    paths:
      - "growthevo/web/**"
      - "apps/mobile/**"
      - "scripts/build_pages.py"
      - "tests/test_web_dashboard.py"
      - "tests/test_product_*.py"
      - "pyproject.toml"
      - ".github/workflows/product-surface.yml"
      - ".github/workflows/deploy-pages.yml"
  push:
    branches: [main]
    paths:
      - "growthevo/web/**"
      - "apps/mobile/**"
      - "scripts/build_pages.py"
      - "tests/test_web_dashboard.py"
      - "tests/test_product_*.py"
      - "pyproject.toml"
      - ".github/workflows/product-surface.yml"
      - ".github/workflows/deploy-pages.yml"

permissions:
  contents: read

jobs:
  web-product:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install web product dependencies
        run: python -m pip install -e '.[web,dev]'
      - name: Run web product tests
        run: pytest tests/test_web_dashboard.py tests/test_product_surface.py tests/test_product_api.py
      - name: Check browser JavaScript syntax
        run: |
          for file in growthevo/web/static/*.js; do node --check "$file"; done
      - name: Build GitHub Pages artifact
        run: python scripts/build_pages.py --output _site
      - name: Check Pages artifact JavaScript
        run: |
          for file in _site/assets/*.js; do node --check "$file"; done
      - name: Install CJK fonts for deterministic screenshots
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
      - name: Capture real rendered UI screenshots
        run: |
          mkdir -p ui-screenshots
          python -m http.server 4173 --directory _site >/tmp/growthevo-pages.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then
              break
            fi
            sleep 0.5
          done
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_BIN"
          chrome_shot() {
            name="$1"
            route="$2"
            "$CHROME_BIN" --headless=new --no-sandbox --disable-dev-shm-usage --hide-scrollbars --force-device-scale-factor=1 --lang=zh-CN --window-size=1536,1024 --screenshot="ui-screenshots/${name}.png" "http://127.0.0.1:4173/#${route}"
            test -s "ui-screenshots/${name}.png"
          }
          chrome_shot growthevo-desktop dashboard
          chrome_shot growthevo-opportunities opportunities
          chrome_shot growthevo-campaign-studio campaignStudio
          chrome_shot growthevo-experiments experiments
          chrome_shot growthevo-realtime realtime
          chrome_shot growthevo-approvals approvals
          chrome_shot growthevo-agent-harness harness
          chrome_shot growthevo-evolution evolution
          "$CHROME_BIN" --headless=new --no-sandbox --disable-dev-shm-usage --hide-scrollbars --force-device-scale-factor=1 --lang=zh-CN --window-size=430,932 --screenshot=ui-screenshots/growthevo-mobile-web.png http://127.0.0.1:4173/
          test -s ui-screenshots/growthevo-mobile-web.png
      - name: Upload rendered UI screenshots
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: growthevo-ui-screenshots
          path: ui-screenshots/*.png
          if-no-files-found: error

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.13"
          cache: npm
          cache-dependency-path: apps/mobile/package.json
      - name: Install mobile dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
