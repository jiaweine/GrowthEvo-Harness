name: Product README Visual Bootstrap

on:
  push:
    branches: [docs/product-visual-story]

permissions:
  contents: write
  actions: read

jobs:
  stage-visuals:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: docs/product-visual-story
      - name: Download verified Product Surface screenshots
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsSL -L \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/11300793078/zip \
            -o /tmp/growthevo-shots.zip
          mkdir -p /tmp/growthevo-shots docs/assets/product
          unzip -q /tmp/growthevo-shots.zip -d /tmp/growthevo-shots
          install -m 0644 /tmp/growthevo-shots/growthevo-agent-harness.png docs/assets/product/readme-agent.png
          install -m 0644 /tmp/growthevo-shots/growthevo-approvals.png docs/assets/product/readme-approvals.png
          install -m 0644 /tmp/growthevo-shots/growthevo-evolution.png docs/assets/product/readme-evolution.png
          test -s docs/assets/product/readme-agent.png
          test -s docs/assets/product/readme-approvals.png
          test -s docs/assets/product/readme-evolution.png
      - name: Commit visuals
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/assets/product/readme-agent.png docs/assets/product/readme-approvals.png docs/assets/product/readme-evolution.png
          git commit -m 'docs: add verified agent and governance screenshots'
          git push origin HEAD:docs/product-visual-story
