name: Capture Nightfall product screenshots
on:
  push:
    branches: [feat/evolution-evaluation-hardening]
    paths:
      - '.github/workflows/capture-nightfall-screenshots.yml'
permissions:
  contents: write
  actions: read
jobs:
  copy-verified-browser-captures:
    if: github.repository == 'jiaweine/GrowthEvo-Harness'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Commit real Chromium screenshots captured by passing Product Surface CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/captures" docs/assets/product
          gh run download 41352828717 --repo "${GITHUB_REPOSITORY}" --name growthevo-ui-screenshots --dir "${RUNNER_TEMP}/captures"
          for name in growthevo-nightfall-desktop growthevo-evolution growthevo-campaign-studio growthevo-nightfall-mobile; do
            test -s "${RUNNER_TEMP}/captures/${name}.png"
          done
          cp "${RUNNER_TEMP}/captures/growthevo-nightfall-desktop.png" docs/assets/product/nightfall-dashboard.png
          cp "${RUNNER_TEMP}/captures/growthevo-evolution.png" docs/assets/product/nightfall-evolution.png
          cp "${RUNNER_TEMP}/captures/growthevo-campaign-studio.png" docs/assets/product/nightfall-campaign-studio.png
          cp "${RUNNER_TEMP}/captures/growthevo-nightfall-mobile.png" docs/assets/product/nightfall-mobile.png
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/assets/product/nightfall-*.png
          git diff --cached --quiet && exit 0
          git commit -m 'docs: preserve verified Nightfall Chromium screenshots [skip ci]'
          git push origin HEAD:feat/evolution-evaluation-hardening
