name: README Screenshot Bootstrap

on:
  push:
    branches: [docs/product-readme]

permissions:
  contents: write

jobs:
  materialize-product-screenshots:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Restore verified product screenshots
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/growthevo-ui docs/assets/product
          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/11283530944/zip" \
            --output /tmp/growthevo-ui.zip
          unzip -q /tmp/growthevo-ui.zip -d /tmp/growthevo-ui
          cp /tmp/growthevo-ui/growthevo-desktop.png docs/assets/product/readme-dashboard.png
          cp /tmp/growthevo-ui/growthevo-opportunities.png docs/assets/product/readme-opportunity-map.png
          cp /tmp/growthevo-ui/growthevo-campaign-studio.png docs/assets/product/readme-campaign-studio.png
          cp /tmp/growthevo-ui/growthevo-experiments.png docs/assets/product/readme-experiments.png
          cp /tmp/growthevo-ui/growthevo-mobile-web.png docs/assets/product/readme-mobile.png
          test -s docs/assets/product/readme-dashboard.png
          test -s docs/assets/product/readme-opportunity-map.png
          test -s docs/assets/product/readme-campaign-studio.png
          test -s docs/assets/product/readme-experiments.png
          test -s docs/assets/product/readme-mobile.png
      - name: Commit product screenshots
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/assets/product/*.png
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "docs: add verified product screenshots"
          git push origin HEAD:docs/product-readme
