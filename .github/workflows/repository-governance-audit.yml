name: Repository Governance Audit

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read
  issues: read

jobs:
  audit-main-governance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Verify active main protection and CI evidence gates
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "schedule" ]]; then
            python tools/repository_governance_audit.py \
              --repo "${GITHUB_REPOSITORY}" \
              --branch main \
              --allow-unconfigured-while-issue-open 63
          else
            python tools/repository_governance_audit.py \
              --repo "${GITHUB_REPOSITORY}" \
              --branch main
          fi
