name: GrowthEvo Pages

on:
  push:
    branches: [main]
    paths:
      - "growthevo/web/static/**"
      - "scripts/build_pages.py"
      - ".github/workflows/deploy-pages.yml"
  pull_request:
    paths:
      - "growthevo/web/static/**"
      - "scripts/build_pages.py"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Build static Pages artifact
        env:
          GROWTHEVO_API_BASE: ${{ vars.GROWTHEVO_API_BASE }}
        run: python scripts/build_pages.py --output _site
      - name: Validate browser JavaScript
        run: |
          for file in _site/assets/*.js; do node --check "$file"; done
      - name: Validate expected files
        run: test -f _site/index.html && test -f _site/assets/config.js && test -f _site/service-worker.js
      - name: Configure Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
