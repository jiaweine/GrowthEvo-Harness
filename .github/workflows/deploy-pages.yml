name: GrowthEvo Pages

on:
  push:
    branches: [main]
    paths:
      - "growthevo/web/static/**"
      - "scripts/build_pages.py"
      - ".github/workflows/deploy-pages.yml"
  pull_request:
    paths:
      - "growthevo/web/static/**"
      - "scripts/build_pages.py"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pages_enabled: ${{ steps.pages-state.outputs.enabled }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Build static Pages artifact
        env:
          GROWTHEVO_API_BASE: ${{ vars.GROWTHEVO_API_BASE }}
        run: python scripts/build_pages.py --output _site
      - name: Validate browser JavaScript
        run: |
          for file in _site/assets/*.js; do node --check "$file"; done
      - name: Validate expected files
        run: test -f _site/index.html && test -f _site/assets/config.js && test -f _site/service-worker.js
      - name: Detect GitHub Pages enablement
        id: pages-state
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RESPONSE="$(mktemp)"
          STATUS="$(curl --silent --show-error --output "$RESPONSE" --write-out '%{http_code}' \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'X-GitHub-Api-Version: 2026-03-10' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/pages")"

          if [[ "$STATUS" == "200" ]]; then
            BUILD_TYPE="$(python - "$RESPONSE" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as handle:
              print(json.load(handle).get("build_type", ""))
          PY
          )"
            if [[ "$BUILD_TYPE" == "workflow" ]]; then
              echo 'enabled=true' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            {
              echo '### GrowthEvo Pages deployment pending'
              echo
              echo 'The Pages site exists, but its publishing source is not **GitHub Actions**.'
              echo 'Set **Settings → Pages → Build and deployment → Source → GitHub Actions**, then run this workflow from `main` again.'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [[ "$STATUS" == "404" ]]; then
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            {
              echo '### GrowthEvo Pages deployment pending'
              echo
              echo 'The static artifact built and validated successfully, but GitHub Pages is not enabled for this repository yet.'
              echo 'One repository-admin action is required: **Settings → Pages → Build and deployment → Source → GitHub Actions**.'
              echo 'After that, run **GrowthEvo Pages** from `main`; the same workflow will configure, upload, and deploy the site.'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "Unexpected GitHub Pages API status: $STATUS" >&2
          cat "$RESPONSE" >&2
          exit 1
      - name: Configure Pages
        if: github.ref == 'refs/heads/main' && steps.pages-state.outputs.enabled == 'true'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && steps.pages-state.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main' && needs.build.outputs.pages_enabled == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
