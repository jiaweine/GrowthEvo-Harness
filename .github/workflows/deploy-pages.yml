name: GrowthEvo Pages

on:
  push:
    branches: [main]
    paths:
      - "growthevo/web/static/**"
      - "scripts/build_pages.py"
      - ".github/workflows/deploy-pages.yml"
  pull_request:
    paths:
      - "growthevo/web/static/**"
      - "scripts/build_pages.py"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Build static Pages artifact
        env:
          GROWTHEVO_API_BASE: ${{ vars.GROWTHEVO_API_BASE }}
        run: python scripts/build_pages.py --output _site
      - name: Validate browser JavaScript
        run: |
          for file in _site/assets/*.js; do node --check "$file"; done
      - name: Validate expected files
        run: test -f _site/index.html && test -f _site/assets/config.js && test -f _site/service-worker.js
      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
