name: GrowthEvo Pages

on:
  push:
    branches: [main]
    paths:
      - "growthevo/web/static/**"
      - "scripts/build_pages.py"
      - ".github/workflows/deploy-pages.yml"
  pull_request:
    paths:
      - "growthevo/web/static/**"
      - "scripts/build_pages.py"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build static Pages artifact
        env:
          GROWTHEVO_API_BASE: ${{ vars.GROWTHEVO_API_BASE }}
        run: python scripts/build_pages.py --output _site
      - name: Validate browser JavaScript
        run: |
          for file in _site/assets/*.js; do node --check "$file"; done
      - name: Validate expected files
        run: test -f _site/index.html && test -f _site/assets/config.js && test -f _site/service-worker.js
      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
