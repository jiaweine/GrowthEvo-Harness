name: Mobile Lock Bootstrap

on:
  pull_request:
    paths:
      - "apps/mobile/package.json"
      - ".github/workflows/mobile-lock-bootstrap.yml"

permissions:
  contents: write

jobs:
  resolve-lock:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.13"
      - name: Resolve lockfile without lifecycle scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Validate resolved dependency tree
        run: npm install --ignore-scripts --no-audit --no-fund && npm run typecheck
      - name: Upload resolved lockfile
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: growthevo-mobile-package-lock
          path: apps/mobile/package-lock.json
          if-no-files-found: error
      - name: Commit lockfile to PR branch
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- apps/mobile/package-lock.json && git ls-files --error-unmatch apps/mobile/package-lock.json >/dev/null 2>&1; then
            echo "package-lock.json already committed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mobile/package-lock.json
          git commit -m "chore(mobile): lock npm dependency graph"
          git push origin "HEAD:${{ github.head_ref }}"
