name: Seed OBD pip cache

on:
  push:
    branches: [main]
    paths:
      - pyproject.toml
      - .github/cache/obd-pip-cache-v1.txt
      - .github/workflows/obd-cache-seed.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  seed-obd-pip-cache:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python and OBD pip cache
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            .github/cache/obd-pip-cache-v1.txt

      - name: Populate trusted OBD dependency cache
        run: |
          python -m pip install --upgrade pip
          pip install \
            --index-url https://download.pytorch.org/whl/cpu \
            --extra-index-url https://pypi.org/simple \
            'torch==2.13.0+cpu'
          pip install --no-deps 'obp==0.4.1'
          pip install -e '.[obd]'
          python - <<'PY'
          from importlib.metadata import version

          import obp
          import torch

          assert torch.__version__ == "2.13.0+cpu"
          assert not torch.cuda.is_available()
          assert obp.__version__ == "0.5.5"
          assert version("sb-obp") == "0.5.10"
          assert version("obp") == "0.4.1"
          print(
              "torch", torch.__version__,
              "cuda_available=", torch.cuda.is_available(),
              "obp_module_version=", obp.__version__,
              "sb_obp_distribution=", version("sb-obp"),
              "legacy_obp_distribution=", version("obp"),
          )
          PY
