name: Seed OBD pip cache

on:
  push:
    branches: [main]
    paths:
      - pyproject.toml
      - .github/cache/obd-pip-cache-v1.txt
      - scripts/bootstrap_obd_ci_environment.py
      - .github/workflows/obd-cache-seed.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  seed-obd-pip-cache:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python and OBD pip cache
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            .github/cache/obd-pip-cache-v1.txt
            scripts/bootstrap_obd_ci_environment.py

      - name: Populate trusted OBD dependency cache
        run: python scripts/bootstrap_obd_ci_environment.py
