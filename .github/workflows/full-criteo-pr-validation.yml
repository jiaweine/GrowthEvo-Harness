name: Full Criteo Research Validation

on:
  workflow_dispatch:
    inputs:
      experiment_reason:
        description: "New preregistered experiment or explicit evidence rerun reason"
        required: true
        type: string

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: full-criteo-research-validation
  queue: max
  cancel-in-progress: false

jobs:
  full-criteo:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      EXPERIMENT_REASON: ${{ inputs.experiment_reason }}
      ACCEPTED_ENVIRONMENT: benchmarks/targeting/results/criteo-v2.1-visit-top10/7ac26a5a/environment.txt

    steps:
      - name: Checkout exact evidence commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Python and frozen Criteo cache
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            benchmarks/targeting/results/criteo-v2.1-visit-top10/7ac26a5a/environment.txt

      - name: Verify reviewed main-history dispatch
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          python scripts/verify_research_dispatch.py \
            --output /tmp/growthevo-full-criteo/dispatch-provenance.json

      - name: Inspect initial runner resources
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -n "$EXPERIMENT_REASON"
          test -f "$ACCEPTED_ENVIRONMENT"
          test "${RUNNER_OS:-}" = "Linux"
          grep -q '^VERSION_ID="24.04"$' /etc/os-release
          mkdir -p /tmp/growthevo-full-criteo
          {
            printf 'runner_os=%s\n' "${RUNNER_OS:-unknown}"
            printf 'runner_arch=%s\n' "${RUNNER_ARCH:-unknown}"
            printf 'image_os=%s\n' "${ImageOS:-unknown}"
            printf 'image_version=%s\n' "${ImageVersion:-unknown}"
            printf 'python=%s\n' "$(python --version 2>&1)"
            printf 'uname=%s\n' "$(uname -a)"
            printf 'libc=%s\n' "$(ldd --version | head -n 1)"
            printf '%s\n' '--- /etc/os-release ---'
            cat /etc/os-release
          } > /tmp/growthevo-full-criteo/runner-environment.txt
          printf 'experiment_reason=%s\n' "$EXPERIMENT_REASON"
          cat /tmp/growthevo-full-criteo/dispatch-provenance.json
          cat /tmp/growthevo-full-criteo/runner-environment.txt
          df -h
          free -h

      - name: Install frozen Criteo research environment
        run: |
          mkdir -p /tmp/growthevo-full-criteo
          grep -E '^[[:alnum:]_.-]+==' "$ACCEPTED_ENVIRONMENT" \
            > /tmp/growthevo-full-criteo/accepted-constraints.txt
          test -s /tmp/growthevo-full-criteo/accepted-constraints.txt

          python -m pip install --upgrade pip
          python -m pip install \
            --constraint /tmp/growthevo-full-criteo/accepted-constraints.txt \
            -e '.[criteo]'
          python scripts/verify_frozen_environment.py "$ACCEPTED_ENVIRONMENT"

      - name: Exercise all five CATE learners before real data
        run: |
          python - <<'PY'
          import importlib.util
          from pathlib import Path
          import numpy as np

          script = Path('scripts/run_criteo_full_locked.py')
          spec = importlib.util.spec_from_file_location('criteo_runner', script)
          module = importlib.util.module_from_spec(spec)
          assert spec is not None and spec.loader is not None
          spec.loader.exec_module(module)
          config, fingerprint = module._load_candidate_config(
              Path('benchmarks/targeting/criteo-lgbm-candidates.v1.json')
          )
          assert fingerprint == 'e10eb2fc6552b28109b67cfe075b55fd1d0e8f62'

          rng = np.random.default_rng(20260830)
          n = 6000
          x = rng.normal(size=(n, 12)).astype(np.float32)
          treatment = (rng.random(n) < 0.82).astype(np.uint8)
          logits = -2.4 + 0.3 * x[:, 0] - 0.2 * x[:, 1] + treatment * (0.35 + 0.25 * (x[:, 2] > 0))
          probability = 1.0 / (1.0 + np.exp(-logits))
          outcome = (rng.random(n) < probability).astype(np.uint8)
          source_index = np.arange(n, dtype=np.uint64)
          train = {'x': x, 't': treatment, 'y': outcome, 'source_index': source_index}
          propensity = float(treatment.mean())
          models = module._fit_candidate_models(
              train, config=config, propensity=propensity, split_seed=20260830
          )
          assert set(models) == {'s-lgbm', 't-lgbm', 'x-lgbm', 'r-lgbm', 'dr-lgbm'}

          validation = {
              'x': x[:1200],
              't': treatment[:1200],
              'y': outcome[:1200],
              'source_index': source_index[:1200],
          }
          for name in sorted(models):
              score = module._predict_candidate(
                  name, models, validation['x'], propensity=propensity, batch_size=257
              )
              assert score.shape == (1200,)
              assert np.isfinite(score).all()
              metrics = module._evaluate_vectorized_targeting(
                  validation, score, propensity=propensity, selected_fraction=0.1
              )
              assert metrics['sample_size'] == 1200
              assert metrics['standard_error'] >= 0

          indices = np.arange(10000, dtype=np.uint64)
          vector = module._split_labels_np(
              indices, seed=20260830, training_fraction=0.5, validation_fraction=0.25
          )
          scalar = np.asarray([
              module._split_label_value(
                  int(index), seed=20260830, training_fraction=0.5, validation_fraction=0.25
              )
              for index in indices
          ], dtype=np.uint8)
          np.testing.assert_array_equal(vector, scalar)
          PY

      - name: Run full preregistered Criteo benchmark
        shell: bash
        run: |
          set -o pipefail
          mkdir -p /tmp/growthevo-full-criteo
          python scripts/run_criteo_full_locked.py \
            --cache-dir /tmp/growthevo-full-criteo/cache \
            --output-dir /tmp/growthevo-full-criteo/result \
            --chunk-size 250000 \
            --prediction-batch-size 250000 \
            2>&1 | tee /tmp/growthevo-full-criteo/full-run.log

      - name: Inspect final result and exact-head provenance
        if: always()
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          df -h
          free -h
          du -sh /tmp/growthevo-full-criteo/* 2>/dev/null || true
          if test -f /tmp/growthevo-full-criteo/result/locked-result.json; then
            python - <<'PY'
          import json
          import os
          from pathlib import Path
          root = Path('/tmp/growthevo-full-criteo/result')
          result = json.loads((root / 'locked-result.json').read_text())
          manifest = json.loads((root / 'export-manifest.json').read_text())
          provenance = json.loads((root / 'source-provenance.json').read_text())
          artifact = result['artifact']
          expected = os.environ['EXPECTED_SHA']
          assert artifact['commit_sha'] == expected
          assert provenance['growth_evo_commit_sha'] == expected
          assert artifact['selected_candidate'] in {'s-lgbm', 't-lgbm', 'x-lgbm', 'r-lgbm', 'dr-lgbm'}
          assert artifact['tuning_fingerprint'] != artifact['test_fingerprint']
          assert artifact['metrics']['candidate_count'] == 5
          assert abs(artifact['metrics']['selected_fraction'] - 0.1) < 1e-6
          assert artifact['metrics']['standard_error'] >= 0
          assert manifest['source_rows'] == 13979592
          assert manifest['candidate_config_fingerprint'] == 'e10eb2fc6552b28109b67cfe075b55fd1d0e8f62'
          assert manifest['holdout_score_policy'] == 'winner-only-after-validation-freeze'
          print(json.dumps({
              'selected_candidate': artifact['selected_candidate'],
              'metrics': artifact['metrics'],
              'tuning_fingerprint': artifact['tuning_fingerprint'],
              'test_fingerprint': artifact['test_fingerprint'],
              'plan': result['experiment_plan'],
          }, indent=2, sort_keys=True))
          PY
          fi

      - name: Freeze research environment
        if: always()
        run: |
          mkdir -p /tmp/growthevo-full-criteo/result
          python -m pip freeze > /tmp/growthevo-full-criteo/result/environment.txt

      - name: Verify complete full Criteo evidence bundle
        if: success()
        shell: bash
        run: |
          for path in \
            /tmp/growthevo-full-criteo/dispatch-provenance.json \
            /tmp/growthevo-full-criteo/accepted-constraints.txt \
            /tmp/growthevo-full-criteo/runner-environment.txt \
            /tmp/growthevo-full-criteo/result/source-provenance.json \
            /tmp/growthevo-full-criteo/result/criteo-v2.1-visit-top10.v1.json \
            /tmp/growthevo-full-criteo/result/criteo-lgbm-candidates.v1.json \
            /tmp/growthevo-full-criteo/result/export-manifest.json \
            /tmp/growthevo-full-criteo/result/locked-result.json \
            /tmp/growthevo-full-criteo/result/environment.txt; do
            test -s "$path"
          done

      - name: Hash full Criteo core evidence bundle
        if: success()
        run: |
          python scripts/write_evidence_integrity_manifest.py \
            --root /tmp/growthevo-full-criteo \
            --output /tmp/growthevo-full-criteo/evidence-integrity.json \
            dispatch-provenance.json \
            accepted-constraints.txt \
            runner-environment.txt \
            result/source-provenance.json \
            result/criteo-v2.1-visit-top10.v1.json \
            result/criteo-lgbm-candidates.v1.json \
            result/export-manifest.json \
            result/locked-result.json \
            result/environment.txt

      - name: Upload full Criteo research evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: criteo-full-preregistered-evidence
          if-no-files-found: warn
          retention-days: 30
          path: |
            /tmp/growthevo-full-criteo/dispatch-provenance.json
            /tmp/growthevo-full-criteo/accepted-constraints.txt
            /tmp/growthevo-full-criteo/runner-environment.txt
            /tmp/growthevo-full-criteo/evidence-integrity.json
            /tmp/growthevo-full-criteo/full-run.log
            /tmp/growthevo-full-criteo/result/source-provenance.json
            /tmp/growthevo-full-criteo/result/criteo-v2.1-visit-top10.v1.json
            /tmp/growthevo-full-criteo/result/criteo-lgbm-candidates.v1.json
            /tmp/growthevo-full-criteo/result/export-manifest.json
            /tmp/growthevo-full-criteo/result/locked-result.json
            /tmp/growthevo-full-criteo/result/environment.txt
