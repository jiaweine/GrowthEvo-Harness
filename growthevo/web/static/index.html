<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#111827" />
  <meta name="description" content="GrowthEvo — 因果驱动的 AI 原生增长操作系统" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/assets/icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/assets/styles.css" />
  <title>GrowthEvo · Growth OS</title>
</head>
<body>
  <div id="app" class="app-shell">
    <aside class="sidebar" aria-label="主导航">
      <div class="brand"><div class="brand-mark">GE</div><div><strong>GrowthEvo</strong><span>因果驱动的增长操作系统</span></div></div>
      <nav id="main-nav" class="nav-list"></nav>
      <div class="workspace-card"><div class="workspace-dot">A</div><div><strong>Acme 电商</strong><span>Enterprise Plan</span></div><span>⌄</span></div>
    </aside>

    <main class="main-column">
      <header class="topbar">
        <button class="mobile-menu" id="mobile-menu" aria-label="打开导航">☰</button>
        <div class="command-search" id="command-open"><span>⌕</span><span>搜索用户、活动、实验、创意或向 AI 提问…</span><kbd>⌘K</kbd></div>
        <div class="top-actions"><button class="ghost">本月</button><button class="ghost">全部渠道⌄</button><button class="icon-button" aria-label="通知">●</button><div class="avatar">L</div></div>
      </header>
      <section class="content" id="view"></section>
      <footer class="statusbar"><span>GrowthEvo · From Insight to Impact.</span><div><span class="status-dot"></span>系统运行正常 · 决策延迟 48 ms · 数据更新 5 分钟前</div></footer>
    </main>

    <aside class="agent-sidecar" id="agent-sidecar" aria-label="Growth Agent">
      <div class="agent-head"><div><span class="agent-glyph">◎</span><strong>Growth Agent</strong><span class="online">在线</span></div><button class="icon-button" id="close-agent">×</button></div>
      <div class="agent-body" id="agent-body"></div>
      <form class="agent-composer" id="agent-form"><textarea id="agent-input" rows="2" placeholder="继续提问，或输入指令…"></textarea><button type="submit" aria-label="发送">↑</button></form>
    </aside>
    <nav class="mobile-tabs" id="mobile-tabs"></nav>
  </div>

  <div class="command-modal" id="command-modal" hidden>
    <div class="command-panel"><div class="command-input"><span>⌕</span><input id="command-input" placeholder="搜索，或输入自然语言指令" /><kbd>Esc</kbd></div><div class="command-results" id="command-results"></div></div>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="/assets/app.js" defer></script>
</body>
</html>
