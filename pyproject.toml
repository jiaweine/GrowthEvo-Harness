[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "growthevo-harness"
dynamic = ["version"]
description = "Causal reinforcement learning runtime for autonomous user growth agents"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "GrowthEvo contributors" }]
keywords = [
  "causal-inference",
  "reinforcement-learning",
  "off-policy-evaluation",
  "uplift-modeling",
  "safe-policy-improvement",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Operating System :: OS Independent",
]
dependencies = []

[project.urls]
Repository = "https://github.com/jiaweine/GrowthEvo-Harness"
Issues = "https://github.com/jiaweine/GrowthEvo-Harness/issues"
Documentation = "https://github.com/jiaweine/GrowthEvo-Harness/tree/main/docs"
Changelog = "https://github.com/jiaweine/GrowthEvo-Harness/blob/main/CHANGELOG.md"

[project.scripts]
growthevo-locked-ope = "growthevo.cli:locked_ope_main"
growthevo-locked-targeting = "growthevo.cli:locked_targeting_main"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
]
obd = [
  "sb-obp==0.5.10; python_version < '3.13'",
]
criteo = [
  "lightgbm==4.7.0",
  "numpy==1.26.4",
  "pandas==2.3.3",
  "scikit-learn==1.9.0",
]

[tool.setuptools.dynamic]
version = {attr = "growthevo._version.__version__"}

[tool.setuptools.packages.find]
include = ["growthevo*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
branch = true
source = ["growthevo"]
